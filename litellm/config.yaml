# Model aliases exposed to Open WebUI. Swap the provider/model strings below
# without touching Open WebUI or graph-tools configuration.
model_list:
  - model_name: asistent-rychly
    litellm_params:
      model: deepseek/deepseek-chat # podporuje tool calling, nutné pro volání graph-tools
      api_key: os.environ/LLM_API_KEY
  - model_name: asistent-velky
    litellm_params:
      model: deepseek/deepseek-reasoner
      api_key: os.environ/LLM_API_KEY
  - model_name: prepis
    litellm_params:
      model: groq/whisper-large-v3-turbo
      api_key: os.environ/STT_API_KEY
    model_info:
      mode: audio_transcription
  - model_name: hlas
    litellm_params:
      model: openai/tts-1
      api_key: os.environ/TTS_API_KEY
    model_info:
      mode: audio_speech

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
